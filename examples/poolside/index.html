<!doctype html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self'; font-src 'self'; script-src 'self'">
  <meta name="theme-color" content="#f7f9f9" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#12181d" media="(prefers-color-scheme: dark)">
  <title>Poolside</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- In a browser, a drawn window frame stands in for the native one so the chrome treatment can be seen. -->
  <div class="desk">
    <div class="window" id="window">
      <aside class="sidebar" aria-label="Pools">
        <div class="sidebar-top drag">
          <span class="traffic" aria-hidden="true"><i></i><i></i><i></i></span>
          <span class="app-name">Poolside</span>
        </div>
        <nav class="pools" id="pools"></nav>
        <div class="rota">
          <p class="rota-label">On the chair</p>
          <ol id="rota"></ol>
        </div>
      </aside>

      <main class="main">
        <header class="toolbar drag">
          <h1 class="pool-title" id="pool-title"></h1>
          <div class="segmented" role="tablist" aria-label="View">
            <button role="tab" id="tab-now" aria-selected="true">Now</button>
            <button role="tab" id="tab-log" aria-selected="false">Log</button>
          </div>
          <button class="primary" id="new-reading"><span aria-hidden="true">+</span> New reading</button>
          <span class="caption" aria-hidden="true"><i>&#xE921;</i><i>&#xE922;</i><i>&#xE8BB;</i></span>
        </header>

        <section class="view" id="view-now" aria-labelledby="tab-now">
          <div class="status" id="status" role="status"></div>
          <div class="tiles" id="tiles"></div>
          <div class="today">
            <h2>Today</h2>
            <table class="log" id="today"></table>
          </div>
        </section>

        <section class="view" id="view-log" aria-labelledby="tab-log" hidden>
          <table class="log full" id="log"></table>
        </section>

        <form class="entry" id="entry" hidden aria-labelledby="entry-title" novalidate>
          <div class="entry-head">
            <h2 id="entry-title">New reading</h2>
            <button type="button" class="ghost" id="entry-cancel">Cancel</button>
          </div>
          <div class="steppers" id="steppers"></div>
          <fieldset class="tester">
            <legend>Tested by</legend>
            <div class="chips" id="who"></div>
          </fieldset>
          <p class="entry-warning" id="entry-warning" role="alert" hidden></p>
          <button type="submit" class="primary big" id="entry-save">Save reading</button>
        </form>

        <p class="sample-note">Sample data: pools, readings, staff and the two-hour testing policy are fictional.</p>
      </main>
    </div>
  </div>
  <script src="app.js"></script>
</body>
</html>
